[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnstream"
version = "0.2.0"
description = "End-to-end Kafka and machine-learning customer churn pipeline"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3,<2.0",
    "kafka-python>=2.0.2,<3.0",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.5,<2.0",
]

[project.scripts]
churn-producer = "kafka_producer_churn:main"
churn-train = "train_model:main"
churn-consumer = "kafka_consumer_churn:main"
churn-pipeline = "run_pipeline:main"
churn-load-snowflake = "snowflake_loader:main"

[tool.setuptools]
py-modules = [
    "kafka_producer_churn",
    "train_model",
    "kafka_consumer_churn",
    "run_pipeline",
    "snowflake_loader",
]

[tool.setuptools.packages.find]
include = ["churnstream*"]
