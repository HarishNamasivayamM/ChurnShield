[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnstream"
version = "0.1.0"
description = "Kafka producer for the ChurnStream customer churn dataset"
requires-python = ">=3.10"
dependencies = ["kafka-python>=2.0.2,<3.0"]

[project.scripts]
churn-producer = "kafka_producer_churn:main"

[tool.setuptools]
py-modules = ["kafka_producer_churn"]
